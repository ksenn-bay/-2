name: measure-gosuslugi
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Замер
        env:
          PSI_API_KEY: ${{ secrets.PSI_API_KEY }}
        run: python measure.py
      - name: Сохранить результат
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add results.csv
          git diff --staged --quiet || (git commit -m "замер $(date -u +%F)" && git push)
